<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis-BBDDs</title>
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-title">
    <button id="backBtn" class="icon-btn hidden">←</button>
    <span id="topIcon" class="logo">📋</span>
    <h1 id="topTitle">Mis-BBDDs</h1>
  </div>
  <div id="authArea">
    <button id="logoutBtn" class="btn btn-ghost hidden">Salir</button>
  </div>
</header>

<!-- Pantalla de login -->
<section id="loginGate" class="login-gate">
  <div class="login-card">
    <span class="logo big">📋</span>
    <h2>Mis-BBDDs</h2>
    <p>Conecta con tu cuenta de Google para ver y editar tus hojas de cálculo.</p>
    <button id="loginBtnGate" class="btn btn-primary">Iniciar sesión con Google</button>
  </div>
</section>

<!-- Selector de módulos (una vez logueado) -->
<main id="modulesScreen" class="screen hidden">
  <section class="list module-list" id="moduleList"></section>
</main>

<!-- Selector de tablero dentro de un módulo (si tiene varios) -->
<main id="boardsScreen" class="screen hidden">
  <section class="list module-list" id="boardList"></section>
</main>

<!-- Módulo "Electricidad el Rellano": cuadro de automáticos + planos por zona -->
<main id="electricidadScreen" class="screen hidden">
  <section class="elec-controls">
    <h2 class="elec-h2">Cuadro eléctrico</h2>
    <div id="elecPanel" class="elec-panel"></div>
    <p class="elec-legend">Toca un automático para ver qué interruptores y enchufes activa en cada plano.</p>
    <button id="elecAparatosBtn" class="btn btn-ghost elec-aparatos-btn">🔌 Ver aparatos eléctricos (5-8)</button>
  </section>

  <div class="chips" id="elecPlanoTabs"></div>

  <section class="elec-plano-wrap">
    <div id="elecPlanoImgWrap" class="elec-plano-imgwrap">
      <img id="elecPlanoImg" class="elec-plano-img" alt="">
      <div id="elecHotspots" class="elec-hotspots"></div>
    </div>
    <div id="elecNotes" class="elec-notes"></div>
  </section>
</main>

<!-- Listado de un tablero concreto -->
<main id="boardScreen" class="screen hidden">
  <section class="toolbar">
    <div class="search-row">
      <input id="searchInput" type="search" placeholder="Buscar…" autocomplete="off">
      <button id="addBtn" class="add-btn" title="Añadir">+</button>
    </div>
    <div class="chips" id="filterChips"></div>
    <div class="facets" id="facetFilters"></div>
  </section>

  <section id="status" class="status hidden"></section>
  <section id="list" class="list"></section>
</main>

<!-- Modal de alta / edición -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Añadir</h2>
      <button id="modalClose" class="icon-btn">✕</button>
    </div>
    <form id="itemForm" class="modal-body">
      <div id="dynamicFields"></div>
      <div class="modal-actions">
        <button type="button" id="deleteBtn" class="btn btn-danger hidden">Eliminar</button>
        <div class="spacer"></div>
        <button type="button" id="cancelBtn" class="btn btn-ghost">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
    <div id="fichaContent" class="modal-body hidden"></div>
  </div>
</div>

<!-- Modal "Aparatos eléctricos" del módulo Electricidad el Rellano -->
<div id="elecAparatosOverlay" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h2>Aparatos eléctricos</h2>
      <button id="elecAparatosClose" class="icon-btn">✕</button>
    </div>
    <div class="modal-body">
      <img id="elecAparatosImg" class="elec-aparatos-img" alt="Aparatos eléctricos">
      <div id="elecAparatosLegend" class="elec-aparatos-legend"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="electricidad-data.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
